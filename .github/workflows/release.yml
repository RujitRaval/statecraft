name: Release

on:
  release:
    types: [published]

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-npm:
    name: Publish npm packages
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      NPM_BOOTSTRAP_TOKEN_PRESENT: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up trusted-publishing runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Configure first-publication npm token
        if: ${{ env.NPM_BOOTSTRAP_TOKEN_PRESENT == 'true' }}
        run: npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN" --location=user
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Validate release identity and metadata
        run: |
          node scripts/check-release-packages.mjs --tag "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD origin/main
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Install pinned Chromium
        run: corepack pnpm --filter statecraft-ui-runner-playwright exec playwright install --with-deps chromium
      - name: Run repository verification
        run: node scripts/run-ci.mjs
      - name: Run production release smoke
        run: env -u GITHUB_OUTPUT corepack pnpm release:smoke
      - name: Pack and test npm artifacts
        run: node scripts/release-package-smoke.mjs --output "$PACKAGE_OUTPUT"
        env:
          PACKAGE_OUTPUT: ${{ runner.temp }}/statecraft-packages
      - name: Publish npm artifacts
        run: node scripts/publish-release-packages.mjs --input "$PACKAGE_OUTPUT" --tag "$RELEASE_TAG"
        env:
          PACKAGE_OUTPUT: ${{ runner.temp }}/statecraft-packages

  verify-public-url:
    name: Verify published public URL journey
    needs: publish-npm
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ github.sha }}
      - name: Set up the registry-consumer runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Run the registry-only consumer gate
        run: node scripts/public-url-registry-smoke.mjs --tag "$RELEASE_TAG" --with-deps
